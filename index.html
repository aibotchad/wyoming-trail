<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Wyoming Trail</title>
    <style>
      @font-face {
        font-family: "Jersey15";
        src: url("fonts/Jersey15-Regular.ttf") format("truetype");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #10131a;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #trouble {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #14110d;
        color: #ede6d6;
        font: 22px "Jersey15", monospace;
        text-align: center;
      }
      #trouble[hidden] {
        display: none;
      }
      #trouble button {
        font: inherit;
        padding: 12px 20px;
        min-width: 240px;
        color: #2a1608;
        background: #efe4b0;
        border: 2px solid #7a4a24;
        border-radius: 4px;
      }
      #game {
        display: block;
        /* Exactly the visible window. 100vh is taller than that on phones
           with a browser bar, which would stretch the art and put taps off
           target. */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* The game handles drag-to-scroll itself. */
        touch-action: none;
        /* A held finger steers; it must not select or pop up a menu. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="game" oncontextmenu="return false"></canvas>
    <noscript>Wyoming Trail needs JavaScript to run.</noscript>
    <div id="trouble" hidden role="alert">
      <div id="trouble-text"></div>
      <button onclick="location.reload()">Reload the game</button>
      <button
        onclick="try { localStorage.removeItem('wyoming-trail.v5') } catch (e) {} location.reload()"
      >
        Erase the saved trip and reload
      </button>
    </div>
    <link data-trunk rel="rust" />
    <link data-trunk rel="copy-dir" href="assets/img" />
    <link data-trunk rel="copy-dir" href="assets/fonts" />
    <script>
      function showTrouble(text) {
        document.getElementById("trouble-text").textContent = text;
        document.getElementById("trouble").hidden = false;
      }
      // Called by the game if it crashes.
      window.gameCrashed = () =>
        showTrouble("Something broke. Your trip was saved after your last choice.");
      // If the game never starts, say so rather than showing a blank page.
      const slow = setTimeout(
        () => showTrouble("The game didn't load. Check the connection, then try again."),
        30000,
      );
      addEventListener("TrunkApplicationStarted", () => clearTimeout(slow));
      // Trunk instantiates the wasm module, then fires this event.
      addEventListener("TrunkApplicationStarted", () => {
        // The canvas can only draw a font that has finished loading.
        document.fonts.load('20px "Jersey15"').finally(() => {
          window.wasmBindings.start(document.getElementById("game"));
        });
      });
    </script>
  </body>
</html>
